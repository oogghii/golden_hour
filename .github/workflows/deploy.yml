name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # So the site can be redeployed without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a cancelled deploy
# can leave the published site half-swapped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the version the build and the 112 tests were verified on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site is only worth publishing if it works. `npm run build` already
      # runs `tsc --noEmit` first, so this covers tests, types and the bundle.
      - run: npm test
      - run: npm run build

      # `enablement` turns Pages on if it has never been configured, so the
      # repository settings do not have to be touched by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
